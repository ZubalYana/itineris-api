version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: itineris-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: itineris_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: itineris_db
    ports:
      - "5432:5432"
    volumes:
      - itineris_pgdata:/var/lib/postgresql/data

volumes:
  itineris_pgdata: